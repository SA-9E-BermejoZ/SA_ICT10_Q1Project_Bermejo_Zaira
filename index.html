<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU Generator | Koffee</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <style>
        py-terminal { display: none; }


:root {
  --paper: #EAE1C7;
  --paper-shadow: #d9cca3;
  --card: #FBF6E7;
  --ink: #2B2318;
  --ink-soft: #746A55;
  --rust: #9C3B2E;
  --rust-deep: #7C2E22;
  --line: #C6B384;
  --charcoal: #1B1712;

  --font-display: 'Fraunces', Georgia, serif;
  --font-label: 'Space Mono', 'Courier New', monospace;
  --font-body: 'Work Sans', Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  min-height: 100%;
}

body {
  margin: 0;
  background: var(--paper);
  background-image:
    radial-gradient(circle, rgba(43,35,24,0.05) 1px, transparent 1px);
  background-size: 14px 14px;
  color: var(--ink);
  font-family: var(--font-body);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

a { color: inherit; }

/* ---------- Navbar ---------- */

.site-nav {
  background: var(--charcoal);
  border-bottom: 3px solid var(--rust);
}

.site-nav .nav-inner {
  max-width: 780px;
  margin: 0 auto;
  padding: 0.9rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
}

.brand {
  font-family: var(--font-label);
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--card);
  text-decoration: none;
}

.nav-toggle {
  display: none;
  background: none;
  border: 1px solid var(--line);
  color: var(--card);
  font-size: 1.1rem;
  padding: 0.3rem 0.6rem;
  border-radius: 3px;
  cursor: pointer;
}

.nav-links {
  display: flex;
  gap: 1.75rem;
  list-style: none;
  margin: 0;
  padding: 0;
}

.nav-links li + li {
  margin-left: 1.75rem;
}

@media (max-width: 640px) {
  .nav-links li + li { margin-left: 0; }
}

.nav-links a {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  text-decoration: none;
  color: #cfc6b3;
  font-family: var(--font-label);
  font-size: 0.78rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 0.35rem 0;
  border-bottom: 2px solid transparent;
  transition: color 0.15s ease, border-color 0.15s ease;
}

.nav-links a:hover { color: var(--card); }

.nav-links a.is-active {
  color: var(--card);
  border-bottom-color: var(--rust);
}

@media (max-width: 640px) {
  .nav-toggle { display: inline-block; }
  .nav-links {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    flex-direction: column;
    background: var(--charcoal);
    padding: 0.5rem 1.5rem 1rem;
    gap: 0.9rem;
    display: none;
    border-bottom: 3px solid var(--rust);
  }
  .nav-links.is-open { display: flex; }
}

/* ---------- Main layout ---------- */

.wrap {
  flex: 1 0 auto;
  max-width: 560px;
  width: 100%;
  margin: 0 auto;
  padding: 3.25rem 1.25rem 2rem;
}

/* ---------- Ticket / card shell ---------- */

.ticket-body {
  background: var(--card);
  border-radius: 10px 10px 0 0;
  box-shadow: 0 18px 40px rgba(43, 35, 24, 0.22);
  padding: 2.5rem 2.25rem 2rem;
  position: relative;
  z-index: 1;
}

/* Torn-paper strip: the two gradients paint alternating card/paper
   triangles, so the notch color is explicit rather than relying on
   whatever happens to sit behind the element. */
.edge {
  height: 16px;
  width: 100%;
  background-image:
    linear-gradient(-45deg, var(--card) 8px, var(--paper) 8px),
    linear-gradient(45deg, var(--card) 8px, var(--paper) 8px);
  background-position: left bottom, left bottom;
  background-size: 16px 16px;
  background-repeat: repeat-x;
  margin-top: -1px;
}

.ticket .edge-top {
  background-position: left top, left top;
  margin-top: 0;
  margin-bottom: -1px;
}

/* ---------- Stamp badge ---------- */

.stamp {
  display: inline-block;
  border: 2px solid var(--rust);
  color: var(--rust);
  font-family: var(--font-label);
  font-size: 0.72rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 0.3rem 0.9rem;
  border-radius: 3px;
  transform: rotate(-3deg);
}

/* ---------- Headline block ---------- */

.title-block { text-align: center; margin-bottom: 0.25rem; }

h1.headline {
  font-family: var(--font-display);
  font-size: 2.1rem;
  font-weight: 600;
  margin: 0.6rem 0 0.15rem;
}

.sub {
  color: var(--ink-soft);
  font-size: 0.92rem;
  margin: 0;
}

.dash-rule {
  border: none;
  border-top: 1.5px dashed var(--line);
  margin: 1.9rem 0;
}

/* ---------- Form fields ---------- */

.field { margin-bottom: 1.6rem; }

.field label {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-family: var(--font-label);
  font-size: 0.72rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 0.55rem;
}

.field label i { color: var(--rust); width: 1em; text-align: center; }

.field input[type="text"],
.field input[type="number"],
.field select {
  width: 100%;
  border: none;
  border-bottom: 1.5px solid var(--line);
  background: transparent;
  padding: 0.5rem 1.1rem 0.5rem 0.1rem;
  font-family: var(--font-body);
  font-size: 1.05rem;
  color: var(--ink);
  border-radius: 0;
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
}

.field input::placeholder { color: #a89d84; }

.field input:focus,
.field select:focus {
  outline: none;
  border-bottom-color: var(--rust);
}

.field input:focus-visible,
.field select:focus-visible {
  outline: 2px solid var(--rust);
  outline-offset: 3px;
}

.btn-stamp:focus-visible {
  outline: 2px solid var(--rust-deep);
  outline-offset: 3px;
}

.nav-links a:focus-visible {
  outline: 2px solid var(--card);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

.select-wrap { position: relative; }

.select-wrap::after {
  content: "";
  position: absolute;
  right: 4px;
  top: 45%;
  width: 7px;
  height: 7px;
  border-right: 1.5px solid var(--ink-soft);
  border-bottom: 1.5px solid var(--ink-soft);
  transform: translateY(-50%) rotate(45deg);
  pointer-events: none;
}

/* ---------- Buttons ---------- */

.btn-stamp {
  display: block;
  width: 100%;
  background: var(--charcoal);
  color: var(--card);
  border: none;
  padding: 1rem 1.5rem;
  font-family: var(--font-label);
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease;
}

.btn-stamp:hover { background: var(--rust-deep); }
.btn-stamp:active { transform: translateY(1px); }

/* ---------- Output / result panels ---------- */

.output-empty {
  color: var(--ink-soft);
  text-align: center;
  font-size: 0.92rem;
  margin: 0;
}

.output-panel {
  border-left: 4px solid var(--rust);
  background: rgba(156, 59, 46, 0.05);
  padding: 1rem 1.25rem 1.15rem;
  border-radius: 0 6px 6px 0;
}

.output-eyebrow {
  font-family: var(--font-label);
  font-size: 0.68rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--ink-soft);
}

.sku-code {
  font-family: var(--font-label);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--rust);
  margin: 0.25rem 0 0.85rem;
}

.output-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem 1rem;
  margin: 0;
}

.output-meta div { display: flex; flex-direction: column; }

.output-meta dt {
  font-family: var(--font-label);
  font-size: 0.65rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--ink-soft);
}

.output-meta dd {
  margin: 0.1rem 0 0;
  font-size: 0.95rem;
}

.stamp-alert {
  border-left: 4px solid var(--rust);
  background: rgba(156, 59, 46, 0.08);
  color: var(--rust-deep);
  padding: 0.85rem 1.1rem;
  border-radius: 0 6px 6px 0;
  font-size: 0.92rem;
}

/* ---------- Receipt-specific ---------- */

.menu-line {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  padding: 0.55rem 0;
}

.menu-line input[type="checkbox"] {
  accent-color: var(--rust);
  width: 1.1em;
  height: 1.1em;
  flex-shrink: 0;
}

.menu-line label {
  font-family: var(--font-body);
  font-size: 1rem;
  cursor: pointer;
  white-space: nowrap;
}

.menu-line .leader {
  flex: 1;
  border-bottom: 1.5px dotted var(--line);
  transform: translateY(-0.35rem);
}

.menu-line .price {
  font-family: var(--font-label);
  font-size: 0.95rem;
  color: var(--ink-soft);
  white-space: nowrap;
}

.receipt-panel {
  border-left: 4px solid var(--rust);
  background: rgba(156, 59, 46, 0.05);
  padding: 1rem 1.25rem 1.15rem;
  border-radius: 0 6px 6px 0;
  font-family: var(--font-label);
}

.receipt-head {
  display: flex;
  justify-content: space-between;
  font-size: 0.72rem;
  color: var(--ink-soft);
  letter-spacing: 1px;
  margin-bottom: 0.75rem;
  border-bottom: 1px dashed var(--line);
  padding-bottom: 0.6rem;
}

.receipt-line {
  display: flex;
  justify-content: space-between;
  font-size: 0.88rem;
  padding: 0.15rem 0;
}

.receipt-total {
  display: flex;
  justify-content: space-between;
  border-top: 2px solid var(--ink);
  margin-top: 0.75rem;
  padding-top: 0.6rem;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--rust);
}

/* ---------- Footer ---------- */

.site-footer {
  background: var(--charcoal);
  color: #a99f8a;
  text-align: center;
  font-family: var(--font-label);
  font-size: 0.75rem;
  letter-spacing: 1.5px;
  padding: 1.4rem 1rem;
}

.site-footer i { color: var(--rust); margin-right: 0.4rem; }

    </style>
</head>
<body>

    <nav class="site-nav">
        <div class="nav-inner">
            <a class="brand" href="index.html">Koffee</a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">&#9776;</button>
            <ul class="nav-links" id="navLinks">
                <li><a class="is-active" href="index.html"><i class="fa-solid fa-barcode"></i> SKU Generator</a></li>
                <li><a href="receipt_generator.html"><i class="fa-solid fa-receipt"></i> Order Now!</a></li>
            </ul>
        </div>
    </nav>

    <div class="wrap">
        <div class="ticket">
            <div class="ticket-body">

                <div class="title-block">
                    <span class="stamp">Inventory</span>
                    <div class="barcode">
                        <span></span><span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                    <h1 class="headline">SKU Generator</h1>
                    <p class="sub">slow coffee bar &middot; by arella & zaira</p>
                </div>

                <hr class="dash-rule">

                <form id="sku-form">
                    <div class="field">
                        <label for="category"><i class="fa-solid fa-tags"></i> Category</label>
                        <div class="select-wrap">
                            <select id="category">
                                <option value="Perishables">Perishables</option>
                                <option value="Beverages">Beverages</option>
                                <option value="Disposables">Disposables</option>
                                <option value="Packaging">Packaging</option>
                            </select>
                        </div>
                    </div>

                    <div class="field">
                        <label for="product_name"><i class="fa-solid fa-box"></i> Product name</label>
                        <input type="text" id="product_name" placeholder="e.g. Bottled Water">
                    </div>

                    <div class="field">
                        <label for="quantity"><i class="fa-solid fa-warehouse"></i> Stock quantity</label>
                        <input type="number" id="quantity" placeholder="e.g. 50" min="0">
                    </div>

                    <button type="button" py-click="SKU_generator" class="btn-stamp">Generate SKU</button>
                </form>

                <hr class="dash-rule">

                <div id="sku_output">
                    <p class="output-empty">Fill in the fields above and the stamped code will land here.</p>
                </div>

            </div>
            <div class="edge"></div>
        </div>
    </div>

    <footer class="site-footer">
        <i class="fa-solid fa-code"></i> Koffee &mdash; Bermejo & Donato &middot; 1st Quarter Project
    </footer>

    <py-script src="main.py"></py-script>

    <script>
        const navToggle = document.getElementById("navToggle");
        const navLinks = document.getElementById("navLinks");
        navToggle.addEventListener("click", () => navLinks.classList.toggle("is-open"));
    </script>
</body>
</html>
